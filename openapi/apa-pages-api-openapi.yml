components:
  schemas:
    Page:
      type: object
      properties:
        date:
          type: string
          description: The date the post was published, in the site's timezone.
          format: date-time
        date_gmt:
          type: string
          description: The date the post was published, as GMT.
          format: date-time
        guid:
          type: object
          description: The globally unique identifier for the post.
          readOnly: true
          properties:
            raw:
              type: string
            rendered:
              type: string
        id:
          type: integer
          description: Unique identifier for the post.
          readOnly: true
        link:
          type: string
          description: URL to the post.
          format: uri
          readOnly: true
        modified:
          type: string
          description: The date the post was last modified, in the site's timezone.
          format: date-time
          readOnly: true
        modified_gmt:
          type: string
          description: The date the post was last modified, as GMT.
          format: date-time
          readOnly: true
        slug:
          type: string
          description: An alphanumeric identifier for the post unique to its type.
        status:
          type: string
          description: A named status for the post.
          enum:
          - publish
          - future
          - draft
          - pending
          - private
          - acf-disabled
          - wpra_emergency
          - wpra_alert
          - wpra_critical
          - wpra_error
          - wpra_warning
          - wpra_notice
          - wpra_info
          - wpra_debug
          - draft-revision
          - pending-revision
          - future-revision
        type:
          type: string
          description: Type of post.
          readOnly: true
        class_list:
          type: array
          description: An array of the class names for the post container element.
          readOnly: true
          items:
            type: string
        parent:
          type: integer
          description: The ID for the parent of the post.
        title:
          type: object
          description: The title for the post.
          properties:
            raw:
              type: string
            rendered:
              type: string
        content:
          type: object
          description: The content for the post.
          properties:
            raw:
              type: string
            rendered:
              type: string
            block_version:
              type: integer
            protected:
              type: boolean
        author:
          type: integer
          description: The ID for the author of the post.
        excerpt:
          type: object
          description: The excerpt for the post.
          properties:
            raw:
              type: string
            rendered:
              type: string
            protected:
              type: boolean
        featured_media:
          type: integer
          description: The ID of the featured media for the post.
        comment_status:
          type: string
          description: Whether or not comments are open on the post.
          enum:
          - open
          - closed
        ping_status:
          type: string
          description: Whether or not the post can be pinged.
          enum:
          - open
          - closed
        menu_order:
          type: integer
          description: The order of the post in relation to other posts.
        meta:
          type: object
          description: Meta fields.
          properties:
            _acf_changed:
              type: boolean
            _uag_custom_page_level_css:
              type: string
            ngg_post_thumbnail:
              type: integer
            footnotes:
              type: string
            _elementor_edit_mode:
              type: string
            _elementor_template_type:
              type: string
            _elementor_data:
              type: string
            _elementor_page_settings:
              type: object
        template:
          type: string
          description: The theme file to use to display the post.
        acf:
          type: object
          description: ACF field data
        publishpress_future_action:
          type: object
          description: Future action
        publishpress_future_workflow_manual_trigger:
          type: object
          description: Workflow Manual Trigger
    Error:
      type: object
      title: Error
      description: WordPress REST API error envelope. Not RFC 9457 problem+json.
      properties:
        code:
          type: string
          description: Machine-readable WordPress error code, e.g. `rest_post_invalid_id`.
        message:
          type: string
          description: Human-readable error message.
        data:
          type: object
          description: Error data; carries the HTTP `status`.
          properties:
            status:
              type: integer
      required:
      - code
      - message
  securitySchemes:
    applicationPassword:
      type: http
      scheme: basic
      description: 'WordPress application passwords. The site''s own root discovery document at https://apacorp.com/wp-json/ publishes this as its only authentication method, with the authorization endpoint at https://apacorp.com/wp-admin/authorize-application.php. Credentials are a WordPress username plus an application password sent as HTTP Basic. It is NOT required for anything documented here: every operation in this spec was verified to answer anonymously on 2026-09-14. An authenticated caller additionally unlocks context=edit fields and the write methods, which are out of scope for this public profile.'
