apis:
- aid: apa:apa-corporation
  name: APA Corporation
  description: >-
    APA Corporation's own corporate web surface at apacorp.com, exposed as a public, unauthenticated WordPress
    REST API at https://apacorp.com/wp-json. This entry covers the self-describing root: the namespace
    index and the content-type, taxonomy and post-status registration records that reveal what the rest
    of the surface holds. APA registers four resources of its own on top of stock WordPress — leaderships,
    presto-videos, visualizer and wprss_feed_item — plus one custom namespace, apa-ticker/v1. Verified
    live on 2026-09-14 with 631 registered routes across 49 namespaces.
  humanURL: https://apacorp.com
