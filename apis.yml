- aid: apa:apa-ticker-api
  name: APA Corporation Ticker API
  description: >-
    The one route on apacorp.com that APA Corporation registered itself rather than inheriting from WordPress
    or a plugin: apa-ticker/v1, a public, unauthenticated, CORS-open JSON endpoint returning the delayed
    APA (Nasdaq: APA) share-price quote that drives the ticker on the corporate site. Verified live on
    2026-09-14 returning symbol, price, change, percent, is_up and source (nasdaq), cached for ten minutes.
  humanURL: https://apacorp.com/wp-json/
