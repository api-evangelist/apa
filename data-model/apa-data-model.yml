relationships:
- from: Post
  to: User
  type: belongs_to
  via: author
  note: Every newsroom post carries an integer author id resolving to a public User.
- from: Post
  to: Category
  type: has_many
  via: categories
  note: Array of integer category term ids. Effectively unused — all 51 posts sit under the single uncategorised term.
- from: Post
  to: Tag
  type: has_many
  via: tags
  note: Array of integer tag term ids. Empty in practice — 0 tags exist.
- from: Post
  to: Attachment
  type: has_one
  via: featured_media
  note: Integer attachment id, 0 when no featured image is set.
- from: Page
  to: Page
  type: belongs_to
  via: parent
  note: Pages are hierarchical; parent is the integer id of the containing page, 0 at the root.
- from: Page
  to: Attachment
  type: has_one
  via: featured_media
  note: Integer attachment id.
- from: Page
  to: User
  type: belongs_to
  via: author
  note: Integer author id.
- from: Leadership
  to: Attachment
  type: has_one
  via: featured_media
  note: Headshot, where set. Leadership is not hierarchical and carries no taxonomy.
- from: MediaHubVideo
  to: Attachment
  type: has_one
  via: featured_media
  note: Poster frame, where set.
- from: Attachment
  to: Post
  type: belongs_to
  via: post
  note: Integer id of the post or page the attachment was uploaded to, 0 when unattached.
- from: Category
  to: Category
  type: belongs_to
  via: parent
  note: Categories are hierarchical.
- from: User
  to: Post
  type: has_many
  via: (reverse of Post.author)
  note: Resolved by querying /wp/v2/posts?author={id} rather than by a field on User.
not_related:
- note: Quote, OEmbed, SearchResult and NamespaceIndex participate in no relationship. They are projections or live upstream reads, not stored records.
