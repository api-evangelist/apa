description: 'Entity-relationship graph for the APA Corporation REST surface, derived from the schemas the server publishes in its own OPTIONS documents. The shape is the WordPress content model: a small number of post-like entities joined by integer id references rather than by $ref, so the relationships below were read from the id-carrying fields (author, featured_media, categories, tags, parent) rather than from schema composition. Four of the entities are APA-registered rather than stock WordPress — Leadership, MediaHubVideo, VisualizerChart and FeedItem — and those are where anything APA-specific lives.'
id_scheme:
  style: integer
  note: All entities are keyed by a site-unique integer WordPress post or term id. Ids are unique across the whole site, not per collection, so an id valid for one collection returns rest_post_invalid_id on another — observed live at GET /wp/v2/leaderships/1.
