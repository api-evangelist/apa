sla:
  published: false
  evidence: No service-level commitment exists for this surface. There is no customer relationship to attach one to.
changelog:
  published: false
  evidence: https://apacorp.com/changelog/ returned 404 on 2026-09-14. No dated release notes were found on any host.
  note: >-
    The nearest thing to a change feed APA does publish is the newsroom RSS at
    https://apacorp.com/feed/ — corporate news, not API change history.
support:
