method: probed
source: live probes of apacorp.com on 2026-09-14 + the wp-json route index
provider: APA Corporation
providerId: apa
description: >-
  Lifecycle posture of the APA Corporation REST surface. The honest summary is that there is no
  lifecycle programme, because there is no API programme: APA has not published a versioning policy,
  a deprecation policy, an SLA, a changelog or a status page for this surface, and none of the
  machine-readable lifecycle signals are present on the wire. What stability the surface has is
  inherited from WordPress core, not committed to by APA.
versioning:
  policy_published: false
  scheme: namespace-in-path
  current:
    - namespace: wp/v2
      note: WordPress core. Stable across WordPress releases; APA does not control it.
    - namespace: apa-ticker/v1
      note: APA's own namespace, currently v1. No published policy for how a v2 would be introduced.
    - namespace: oembed/1.0
      note: oEmbed 1.0, versioned by the standard.
  breaking_change_policy: null
  evidence: >-
    Read from the namespaces[] array of https://apacorp.com/wp-json/ on 2026-09-14. No policy page
    exists; https://apacorp.com/changelog/ returned 404.
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  deprecated_operations: []
  evidence: >-
    No Sunset (RFC 8594) or Deprecation header appeared on any response observed on 2026-09-14, and
    no operation in the eleven derived OpenAPIs carries deprecated: true. No deprecation policy page
    was found.
  note: >-
    Recorded as absent, not as clean. An operator relying on apa-ticker/v1/quote has no notice
    mechanism if APA retires or reshapes it.
status_page:
